<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Converter</title>
</head>
<body>
    <h1>Unit Converter</h1>

    <a href="index.html">Length</a>
    <a href="weight.html">Weight</a>
    <a href="temperature.html">Temperature</a>

    <form action="" method="post">
        <br>
        <label for="weight">Enter weight to convert:</label>
        <input type="number" id="weight" name="weight" required> <br> <br>

        <label for="fromUnit">Unit to convert from:</label>
        <select id="fromUnit" name="fromUnit" required>
            <option value="milligram">milligram</option>
            <option value="gram">gram</option>
            <option value="kilogram">kilogram</option>
            <option value="ounce">ounce</option>
            <option value="pound">pound</option>
        </select> <br> <br>

        <label for="toUnit">Unit to convert to:</label>
        <select id="toUnit" name="toUnit" required>
            <option value="milligram">milligram</option>
            <option value="gram">gram</option>
            <option value="kilogram">kilogram</option>
            <option value="ounce">ounce</option>
            <option value="pound">pound</option>
        </select> <br> <br>

        <input type="submit" value="Convert" onclick="convertWeight()"> <br> <br >
    </form>
</body>
</html>
