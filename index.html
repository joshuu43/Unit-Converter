<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Converter</title>
</head>
<body>
    <h1>Unit Converter</h1>

    <a href="index.html">Length</a>
    <a href="weight.html">Weight</a>
    <a href="temperature.html">Temperature</a>

    <form action="" method="post">
        <br>
        <label for="length">Enter length to convert:</label>
        <input type="number" id="length" name="length" required> <br> <br>

        <label for="fromUnit">Unit to convert from:</label>
        <select id="fromUnit" name="fromUnit" required>
            <option value="millimeter">millimeter</option>
            <option value="centimeter">centimeter</option>
            <option value="meter">meter</option>
            <option value="kilometer">kilometer</option>
            <option value="inch">inch</option>
            <option value="foot">foot</option>
            <option value="yard">yard</option>
            <option value="mile">mile</option>
        </select> <br> <br>

        <label for="toUnit">Unit to convert to:</label>
        <select id="toUnit" name="toUnit" required>
            <option value="millimeter">millimeter</option>
            <option value="centimeter">centimeter</option>
            <option value="meter">meter</option>
            <option value="kilometer">kilometer</option>
            <option value="inch">inch</option>
            <option value="foot">foot</option>
            <option value="yard">yard</option>
            <option value="mile">mile</option>
        </select> <br> <br>

        <input type="submit" value="Convert" onclick="convertLength()"> <br> <br >
    </form>
</body>
</html>
