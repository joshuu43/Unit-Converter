<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Converter</title>
    <script src="script.js" defer></script>
</head>
<body>
    <h1>Unit Converter</h1>

    <a href="index.html">Length</a>
    <a href="weight.html">Weight</a>
    <a href="temperature.html">Temperature</a>

    <form action="" method="post">
        <br>
        <label for="temperature">Enter temperature to convert:</label>
        <input type="number" id="temperature" name="temperature" required> <br> <br>

        <label for="fromUnit">Unit to convert from:</label>
        <select id="fromUnit" name="fromUnit" required>
            <option value="celsius">Celsius</option>
            <option value="fahrenheit">Fahrenheit</option>[
            <option value="kelvin">Kelvin</option>
        </select> <br> <br>

        <label for="toUnit">Unit to convert to:</label>
        <select id="toUnit" name="toUnit" required>
            <option value="celsius">Celsius</option>
            <option value="fahrenheit">Fahrenheit</option>[
            <option value="kelvin">Kelvin</option>
        </select> <br> <br>

        <input type="submit" value="Convert" onclick="convertTemperature()"> <br> <br >
    </form>

    <h3 id="result">result: </h3>
</body>
</html>
